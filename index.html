// Standalone data layer: reads data.json (refreshed every 60s) in place of the Claude-hosted database.
(function(){
  var SRC = window.HUB_DATA || 'data.json';
  var cache = null, subs = [];

  var db = { collection: function(c){ return {
      onSnapshot: function(cb){ var s={c:c,cb:cb}; subs.push(s); if (cache) cb({docs:(cache[c]||[]).map(function(x){ return {id:x.id, data:function(){ return x; }}; })}); return function(){ subs = subs.filter(function(t){ return t!==s; }); }; },
      add: ro, doc: function(){ return { update: ro, delete: ro, set: ro }; } }; } };
  pull(); setInterval(pull, 60000);
  window.claude = { use: function(n){ return Promise.resolve(n==='db' ? db : null); } };

<script>
(() => {
  // Team colors (primary, secondary). Badges show the team abbreviation; no logos.
  const TEAMS = {

    MIN:['#4F2683','#FFC62F'], NE:['#002244','#C60C30'], NO:['#D3BC8D','#101820'], NYG:['#0B2265','#A71930'],
    NYJ:['#125740','#FFFFFF'], PHI:['#004C54','#A5ACAF'], PIT:['#FFB612','#101820'], SF:['#AA0000','#B3995D'],
    SEA:['#002244','#69BE28'], TB:['#D50A0A','#34302B'], TEN:['#0C2340','#4B92DB'], WAS:['#5A1414','#FFB612']
  };
  const LIGHT = new Set(['NO', 'PIT']);
  const $ = (id) => document.getElementById(id);

  const CITY = { ARI:'Arizona', ATL:'Atlanta', BAL:'Baltimore', BUF:'Buffalo', CAR:'Carolina', CHI:'Chicago', CIN:'Cincinnati', CLE:'Cleveland',
    DAL:'Dallas', DEN:'Denver', DET:'Detroit', GB:'Green Bay', HOU:'Houston', IND:'Indianapolis', JAX:'Jacksonville', KC:'Kansas City',
    LV:'Las Vegas', LAC:'Los Angeles', LA:'Los Angeles', MIA:'Miami', MIN:'Minnesota', NE:'New England', NO:'New Orleans', NYG:'New York',
    NYJ:'New York', PHI:'Philadelphia', PIT:'Pittsburgh', SF:'San Francisco', SEA:'Seattle', TB:'Tampa Bay', TEN:'Tennessee', WAS:'Washington' };
  // Original crest shapes and patterns, assigned per team so the line reads as a row of team crests.
  const SHAPES = {
    shield: 'M50 3 L93 15 V48 C93 73 73 89 50 97 C27 89 7 73 7 48 V15 Z',
    hex: 'M50 3 L93 26 V74 L50 97 L7 74 V26 Z',

  const SHAPE_KEYS = Object.keys(SHAPES);
  let crestSeq = 0;
  const hash = (t) => [...t].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
  function crestSVG(abbr, small) {
    const [c1, c2] = TEAMS[abbr];
    const h = hash(abbr);
    const shape = SHAPE_KEYS[h % 4], pat = (h >> 3) % 4;
    const id = 'cr' + (++crestSeq);
    const ink = LIGHT.has(abbr) ? '#101820' : '#ffffff';
    const pattern = [
      '<path d="M-10 70 L70 -10 L92 -10 L-10 92 Z" fill="' + c2 + '"/>',                                   // sash
      '<rect x="30" y="0" width="8" height="100" fill="' + c2 + '"/><rect x="62" y="0" width="8" height="100" fill="' + c2 + '"/>', // twin stripes
      '<path d="M0 66 L50 40 L100 66 V80 L50 54 L0 80 Z" fill="' + c2 + '"/>',                           // chevron

    ][pat];
    const size = abbr.length === 3 ? 30 : 36;
    const city = small ? '' : '<text x="50" y="' + (shape === 'pennant' ? 22 : 26) + '" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="' + (CITY[abbr].length > 11 ? 7 : 8.5) + '" letter-spacing="1" fill="' + ink + '" opacity=".9">' + CITY[abbr].toUpperCase() + '</text>';
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<defs><clipPath id="' + id + '"><path d="' + SHAPES[shape] + '"/></clipPath></defs>' +
      '<g clip-path="url(#' + id + ')"><rect width="100" height="100" fill="' + c1 + '"/>' + pattern + '</g>' +
      '<path d="' + SHAPES[shape] + '" fill="none" stroke="#eef3ec" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="' + SHAPES[shape] + '" fill="none" stroke="' + c2 + '" stroke-width="1.5" stroke-linejoin="round" transform="translate(50 50) scale(.86) translate(-50 -50)"/>' +
      city +
      '<text x="50" y="' + (small ? 61 : 63) + '" text-anchor="middle" font-family="Saira Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="' + size + '" fill="' + ink + '" stroke="' + (LIGHT.has(abbr) ? 'none' : 'rgba(0,0,0,.35)') + '" stroke-width="1" paint-order="stroke">' + abbr + '</text>' +
      '</svg>';
  }
  function badge(abbr, small) {
    const el = document.createElement('div');
    el.className = 'badge' + (small ? ' sm' : '');
    el.title = (CITY[abbr] || abbr) ;
    if (TEAMS[abbr]) el.innerHTML = crestSVG(abbr, small);    // abbr is a fixed key of TEAMS here
    else { el.classList.add('plain'); el.textContent = abbr || '?'; }
    if (!small) el.style.animationDelay = (-Math.random() * 4.6).toFixed(2) + 's';

  }

  function fillFlow(abbrs) {
    const list = abbrs.length ? abbrs : Object.keys(TEAMS);
    const half = Math.ceil(list.length / 2);
    const rows = [list];
    [$('flow-a')].forEach((track, i) => {
      track.replaceChildren();
      let row = rows[i];
      while (row.length < 16) row = row.concat(rows[i]);       // keep the line full on wide screens
      [...row, ...row].forEach((a) => track.appendChild(badge(a, false)));  // doubled for a seamless loop
    });
  }

  const fmtOdds = (o) => (o == null || o === '' ? '' : (Number(o) > 0 ? '+' + Number(o) : String(o)));
  const pct = (x) => (x == null || x === '' ? '–' : Math.round(Number(x) * 100) + '%');
  const dateFmt = new Intl.DateTimeFormat('en-CA', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Toronto' });
  const kickFmt = new Intl.DateTimeFormat('en-CA', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Toronto' });
  const TIER = { best: 'Best bet', value: 'Value', longshot: 'Long shot', safe: 'High hit rate' };
  const STATUS_ORDER = { live: 0, upcoming: 1, final: 2 };

  let games = [], picks = [], slips = [], firstPicks = true, DB = null, meta = {};
  const legs = [];                       // pick ids in the slip builder
  let prevSeen = null;
  try { prevSeen = localStorage.getItem('hub-seen-at'); } catch (_) {}
  const implied = (am) => { am = Number(am); if (!am) return null; return am < 0 ? -am / (-am + 100) : 100 / (am + 100); };
  const toAm = (pr) => { if (!(pr > 0 && pr < 1)) return null; return pr >= 0.5 ? -Math.round(100 * pr / (1 - pr)) : Math.round(100 * (1 - pr) / pr); };
  const dec = (am) => { am = Number(am); return am < 0 ? 1 + 100 / -am : 1 + am / 100; };
  const money = (x) => (x < 0 ? '−$' : (x > 0 ? '+$' : '$')) + Math.abs(x).toFixed(2);
  const parseAm = (v) => { const n = Number(String(v || '').replace(/[^\d+\-.]/g, '')); return n && Math.abs(n) >= 100 ? Math.round(n) : null; };
  const legProb = (p) => (p.model_pct != null ? Number(p.model_pct) : p.book_pct != null ? Number(p.book_pct) : implied(p.odds));
  // inverse normal CDF (Acklam)
  function invNorm(pr) {

  // ---- suggested 2-leg parlays (computed from the sims) ----

  // ---- record + calibration ----
  function renderRecord(box) {
    box.replaceChildren();
    const done = picks.filter((p) => p.status === 'won' || p.status === 'lost').map((p) => ({ p, g: games.find((x) => x.id === p.game_id) || {} }));
    const wrap = document.createElement('div'); wrap.style.gridColumn = '1 / -1'; wrap.style.display = 'grid'; wrap.style.gap = '12px';
    const W = (a) => a.filter((r) => r.p.status === 'won').length;
    const pctS = (a) => a.length ? Math.round(100 * W(a) / a.length) + '%' : '–';
    const tiles = document.createElement('div'); tiles.className = 'pl-row'; tiles.style.marginTop = '0';
    const tile = (lab, val, sub) => { const d = document.createElement('div'); d.className = 'pl-tile'; const a = document.createElement('span'); a.textContent = lab; const b = document.createElement('b'); b.textContent = val; const c = document.createElement('small'); c.textContent = sub; d.append(a, b, c); tiles.appendChild(d); };
    tile('All picks', W(done) + '–' + (done.length - W(done)), pctS(done) + ' hit rate');
    const slip = done.filter((r) => r.p.on_slip); tile('Owner\'s slip legs', W(slip) + '–' + (slip.length - W(slip)), pctS(slip) + ' hit rate');
    const withM = done.filter((r) => r.p.model_pct != null);
    const exp = withM.reduce((m, r) => m + Number(r.p.model_pct), 0);
    tile('Model expected vs actual', withM.length ? Math.round(exp) + ' vs ' + W(withM) : '–', withM.length ? withM.length + ' picks with a model number' : 'Fills in as picks settle');
    wrap.appendChild(tiles);
    const table = (title, groups) => {
      const card = document.createElement('div'); card.className = 'om';
      const head = document.createElement('div'); head.className = 'om-row om-head rec-row'; [title, 'Picks', 'W–L', 'Hit %'].forEach((t) => { const c = document.createElement('span'); c.textContent = t; head.appendChild(c); }); card.appendChild(head);
      groups.filter(([, a]) => a.length).forEach(([name, a]) => {
        const r = document.createElement('div'); r.className = 'om-row rec-row';
        [name, String(a.length), W(a) + '–' + (a.length - W(a)), pctS(a)].forEach((t, i) => { const c = document.createElement('span'); c.className = i ? 'om-num' : 'om-pick'; c.textContent = t; r.appendChild(c); });
        card.appendChild(r);
      });
      return card;
    };
    const weeks = [...new Set(done.map((r) => r.g.week).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    const lbl = (t) => { const l = document.createElement('div'); l.className = 'games-label'; l.style.margin = '6px 0 -4px'; l.textContent = t; return l; };
    wrap.append(lbl('By week'), table('Week', weeks.map((w) => [w, done.filter((r) => r.g.week === w)])));
    const type = (p) => /\btd\b/i.test(p.bet) && !/pass/i.test(p.bet) ? 'Touchdowns' : /moneyline/i.test(p.bet) ? 'Moneyline' : /under/i.test(p.bet) ? 'Unders' : /rec(eiving)? yds|rec yds/i.test(p.bet) ? 'Receiving yards' : /rush/i.test(p.bet) ? 'Rushing yards' : /pass/i.test(p.bet) ? 'Passing' : /reception/i.test(p.bet) ? 'Receptions' : 'Other';
    const types = ['Receiving yards', 'Rushing yards', 'Passing', 'Receptions', 'Touchdowns', 'Moneyline', 'Unders', 'Other'];
    wrap.append(lbl('By bet type'), table('Type', types.map((t) => [t, done.filter((r) => type(r.p) === t)])));
    // calibration: does a 70% pick hit ~70% of the time?
    const B = [[0, 0.4, 'Under 40%'], [0.4, 0.55, '40–55%'], [0.55, 0.65, '55–65%'], [0.65, 0.75, '65–75%'], [0.75, 1.01, '75%+']];
    const cal = document.createElement('div'); cal.className = 'om';
    const ch = document.createElement('div'); ch.className = 'om-row om-head cal-row'; ['Model said', 'Picks', 'Expected', 'Actual'].forEach((t) => { const c = document.createElement('span'); c.textContent = t; ch.appendChild(c); }); cal.appendChild(ch);
    let any = false;

    wrap.append(lbl('Model check · do the hit rates hold up?'));
    if (any) wrap.appendChild(cal); else { const e = document.createElement('div'); e.className = 'slips-empty'; e.textContent = 'Fills in as picks with a model number settle.'; wrap.appendChild(e); }
    const nt = document.createElement('div'); nt.className = 'b-note'; nt.textContent = 'Small samples swing a lot. The model check gets meaningful after a few hundred settled picks.'; wrap.appendChild(nt);
    box.appendChild(wrap);
  }
  // ---- player search ----
  function runSearch() {
    const q = ($('srch').value || '').trim().toLowerCase(), out = $('srch-out');
    if (q.length < 2) { out.hidden = true; out.replaceChildren(); return; }
    const res = new Map();
    const add = (name, team, line) => { const k = name.toLowerCase(); if (!k.includes(q)) return; if (!res.has(k)) res.set(k, { name, team, lines: [] }); const e = res.get(k); if (!e.team && team) e.team = team; e.lines.push(line); };
    picks.forEach((p) => { const g = games.find((x) => x.id === p.game_id) || {}; add(p.player, p.team, (g.week ? g.week + ' · ' : '') + 'Pick: ' + p.bet + (p.odds != null ? ' ' + fmtOdds(p.odds) : '') + (p.model_pct != null ? ' · model ' + pct(p.model_pct) : '') + ((p.status && p.status !== 'pending') ? ' · ' + (p.status === 'won' ? 'Won' : 'Lost') : '')); });
    games.forEach((g) => {
      (g.tdboard || []).forEach((x) => add(x.player, x.team, 'TD chance: ' + Math.round(x.pct * 100) + '%'));
      Object.entries(g.boards || {}).forEach(([mk, arr]) => { const lab = { recyd: 'rec yds', rushyd: 'rush yds', passyd: 'pass yds', rec: 'receptions' }[mk] || mk; (arr || []).forEach((x) => add(x.player, x.team, lab + ' ' + x.line + ': over ' + Math.round(x.over * 100) + '% · under ' + Math.round(x.under * 100) + '%' + (x.proj != null ? ' · proj ' + Math.round(x.proj) : ''))); });
    });
    out.replaceChildren();
    if (!res.size) { const e = document.createElement('div'); e.className = 'srch-none'; e.textContent = 'No player matches yet.'; out.appendChild(e); }
    [...res.values()].slice(0, 6).forEach((r) => {
      const c = document.createElement('div'); c.className = 'srch-card';
      const h = document.createElement('div'); h.className = 'srch-h'; if (r.team && TEAMS[r.team]) h.appendChild(badge(r.team, true)); const b = document.createElement('b'); b.textContent = r.name; h.appendChild(b);

      c.append(h, ul); out.appendChild(c);

    out.hidden = false;
