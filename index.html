// Standalone data layer: reads data.json (refreshed every 60s) in place of the Claude-hosted database.
(function(){
  var SRC = window.HUB_DATA || 'data.json';
  var cache = null, subs = [];
  function pull(){ return fetch(SRC + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){ cache = j; subs.forEach(function(s){ s.cb({docs:(cache[s.c]||[]).map(function(x){ return {id:x.id, data:function(){ return x; }}; })}); }); }).catch(function(){}); }
  var ro = function(){ return Promise.reject(new Error('read-only')); };
  var db = { collection: function(c){ return {
      onSnapshot: function(cb){ var s={c:c,cb:cb}; subs.push(s); if (cache) cb({docs:(cache[c]||[]).map(function(x){ return {id:x.id, data:function(){ return x; }}; })}); return function(){ subs = subs.filter(function(t){ return t!==s; }); }; },
      add: ro, doc: function(){ return { update: ro, delete: ro, set: ro }; } }; } };
  pull(); setInterval(pull, 60000);
  window.claude = { use: function(n){ return Promise.resolve(n==='db' ? db : null); } };
})();

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Slate-themed field: the background follows the next game on the board. TNF = night game under the lights, Sunday = daylight game day, MNF = broadcast scoreboard, other days = film-room turf. */
  :root {
    --turf: #0c2a1f;
    --turf-deep: #071a13;
    --chalk: #eef3ec;
    --chalk-dim: #a9bdb2;
    --line: rgba(238, 243, 236, 0.13);
    --card: #0f3326;
    --card-edge: rgba(238, 243, 236, 0.16);
    --flag: #f2c230;
    --win: #5fd38a;
    --loss: #ff7a6b;
    --pending: #8fb3ff;
    --hub-bg: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(238,243,236,.13) calc(10% - 1px) 10%), radial-gradient(120% 80% at 50% 0%, #0c2a1f 0%, #071a13 70%);
    --card-bg: linear-gradient(180deg, rgba(15,51,38,.96), rgba(10,38,28,.96));
    --card-ink: #eef3ec;
    --card-dim: #a9bdb2;
    --pill-bg: rgba(7,26,19,.55);
    --pill-ink: #eef3ec;
    --divider: rgba(238,243,236,.07);
    --head-shadow: none;
    --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--turf-deep); margin: 0; }
  html:has(.hub[data-slate="tnf"]), html:has(.hub[data-slate="tnf"]) body, html:has(.hub[data-slate="snf"]), html:has(.hub[data-slate="snf"]) body { background: #01020a; }
  html:has(.hub[data-slate="mnf"]), html:has(.hub[data-slate="mnf"]) body { background: #010106; }
  body { color: var(--chalk); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  .hub { min-height: 100%; background: var(--hub-bg); transition: background .6s ease; }
  .hub h1, .hub .eyebrow, .hub h2 { text-shadow: var(--head-shadow); }

  /* Night games (TNF, SNF, MNF): black-blue star field, lit by the two teams' colors from either side */
  .hub[data-slate="tnf"], .hub[data-slate="snf"], .hub[data-slate="mnf"] {
    --hub-bg:
      radial-gradient(70% 60% at -5% 8%, var(--glow-away, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(70% 60% at 105% 8%, var(--glow-home, rgba(60,90,200,.45)), transparent 70%),
      linear-gradient(180deg, #010208 0%, #050c22 50%, #0a1736 100%);
    --card-bg: linear-gradient(180deg, rgba(10,18,40,.9), rgba(6,12,30,.92));
    --card-edge: rgba(190,210,255,.18); --line: rgba(190,210,255,.14);
    --card-dim: #a9b8d6; --chalk-dim: #b4c3df; --pill-bg: rgba(3,6,18,.65);
    --flag: #ffd84d; --pending: #9ec2ff;
    position: relative; isolation: isolate;
  }
  /* Thursday night: electric. Neon-cyan field grid glowing on the horizon, laser sweeps, rapid-fire fireworks */
  .hub[data-slate="tnf"] {
    --hub-bg:
      radial-gradient(70% 55% at -5% 6%, var(--glow-away, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(70% 55% at 105% 6%, var(--glow-home, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(110% 40% at 50% 108%, rgba(40,220,255,.40), transparent 70%),
      linear-gradient(180deg, #010208 0%, #04102a 50%, #062338 85%, #07303f 100%);
    --flag: #3fe3ff; --pending: #ffd84d; --card-edge: rgba(80,225,255,.24); --line: rgba(80,225,255,.18);
    --card-bg: linear-gradient(180deg, rgba(6,20,40,.9), rgba(4,12,28,.93));
  }
  /* Monday night: crimson horizon glow under the stars, red and amber broadcast accents */
  .hub[data-slate="mnf"] {
    --hub-bg:
      radial-gradient(70% 60% at -5% 8%, var(--glow-away, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(70% 60% at 105% 8%, var(--glow-home, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(120% 45% at 50% 110%, rgba(214,32,46,.55), transparent 70%),
      linear-gradient(180deg, #010106 0%, #080716 45%, #1d0710 82%, #2c0911 100%);
    --card-bg: linear-gradient(180deg, rgba(22,10,16,.92), rgba(12,6,12,.94));
    --card-edge: rgba(255,90,90,.24); --line: rgba(255,120,110,.18);
    --flag: #ff4040; --pending: #ffb020; --card-dim: #c9b0b0; --chalk-dim: #d6bcbc; --pill-bg: rgba(14,4,8,.7);
  }
  /* Sunday night primetime: midnight sky over a glowing stadium bowl, crossing premiere searchlights, gold confetti */
  .hub[data-slate="snf"] {
    --hub-bg:
      radial-gradient(70% 55% at -5% 6%, var(--glow-away, rgba(60,90,200,.45)), transparent 70%),
      radial-gradient(70% 55% at 105% 6%, var(--glow-home, rgba(60,90,200,.45)), transparent 70%),
